<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tutor</title>
  <style>
    :root { --fondo: #f6f7f9; --tarjeta: #fff; --texto: #1c1f24; --suave: #6b7280; --acento: #2457d6; --borde: #e3e6ea; }
    @media (prefers-color-scheme: dark) {
      :root { --fondo: #111317; --tarjeta: #1b1e24; --texto: #e8eaed; --suave: #9aa0a6; --acento: #6c94ff; --borde: #2a2e35; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--fondo); color: var(--texto); font: 16px/1.5 system-ui, sans-serif; height: 100dvh; display: flex; flex-direction: column; }
    header { padding: 12px 16px; border-bottom: 1px solid var(--borde); font-weight: 600; }
    #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; max-width: 760px; width: 100%; margin: 0 auto; }
    .msg { padding: 10px 14px; border-radius: 14px; max-width: 85%; white-space: pre-wrap; overflow-wrap: anywhere; }
    .user { align-self: flex-end; background: var(--acento); color: #fff; }
    .assistant { align-self: flex-start; background: var(--tarjeta); border: 1px solid var(--borde); }
    .aviso { align-self: center; color: var(--suave); font-size: 14px; }
    form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--borde); max-width: 760px; width: 100%; margin: 0 auto; }
    textarea { flex: 1; resize: none; padding: 10px; border-radius: 10px; border: 1px solid var(--borde); background: var(--tarjeta); color: var(--texto); font: inherit; }
    button { padding: 0 18px; border: 0; border-radius: 10px; background: var(--acento); color: #fff; font: inherit; cursor: pointer; }
    button:disabled { opacity: .5; }
  </style>
</head>
<body>
  <header>Tutor</header>
  <main id="chat"></main>
  <form id="formulario">
    <textarea id="entrada" rows="2" placeholder="Escribe tu duda…"></textarea>
    <button id="enviar">Enviar</button>
  </form>

  <script>
    const chat = document.getElementById("chat");
    const entrada = document.getElementById("entrada");
    const enviar = document.getElementById("enviar");

    function leerClave() {
      try { return localStorage.getItem("clave"); } catch { return null; }
    }
    function guardarClave(clave) {
      try { localStorage.setItem("clave", clave); } catch {}
    }
    let clave = leerClave() || pedirClave();
    function pedirClave() {
      const nueva = prompt("Clave de acceso:") || "";
      guardarClave(nueva);
      return nueva;
    }

    function mostrar(rol, texto) {
      const burbuja = document.createElement("div");
      burbuja.className = "msg " + rol;
      burbuja.textContent = texto;
      chat.append(burbuja);
      chat.scrollTop = chat.scrollHeight;
      return burbuja;
    }

    async function api(ruta, opciones = {}) {
      const respuesta = await fetch(ruta, {
        ...opciones,
        headers: { "content-type": "application/json", authorization: "Bearer " + clave },
      });
      if (respuesta.status === 401) { clave = pedirClave(); throw new Error("Clave incorrecta. Vuelve a intentar."); }
      const datos = await respuesta.json();
      if (!respuesta.ok) throw new Error(datos.error || "Algo falló.");
      return datos;
    }

    async function cargarHistorial() {
      try {
        const { mensajes } = await api("/api/historial");
        if (mensajes.length === 0) mostrar("aviso", "Hola. Cuéntame qué estudias y en qué materia quieres mejorar.");
        for (const m of mensajes) mostrar(m.role, m.content);
      } catch (error) {
        mostrar("aviso", error.message);
      }
    }

    document.getElementById("formulario").addEventListener("submit", async (evento) => {
      evento.preventDefault();
      const texto = entrada.value.trim();
      if (!texto) return;
      entrada.value = "";
      mostrar("user", texto);
      enviar.disabled = true;
      const pensando = mostrar("aviso", "Pensando…");
      try {
        const { respuesta } = await api("/api/chat", { method: "POST", body: JSON.stringify({ texto }) });
        pensando.remove();
        mostrar("assistant", respuesta);
      } catch (error) {
        pensando.textContent = error.message;
      } finally {
        enviar.disabled = false;
        entrada.focus();
      }
    });

    entrada.addEventListener("keydown", (evento) => {
      if (evento.key === "Enter" && !evento.shiftKey) {
        evento.preventDefault();
        document.getElementById("formulario").requestSubmit();
      }
    });

    cargarHistorial();
  </script>
</body>
</html>
