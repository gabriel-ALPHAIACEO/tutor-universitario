# Prueba cada cambio y publica en Cloudflare solo lo que entra a main.
# GitHub arma aquí la imagen de la computadora en la nube (Docker), así la PC no hace ese trabajo.
name: Probar y publicar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nunca dos publicaciones a la vez.
concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  publicar:
    needs: probar
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ACCESO_CLAVE: ${{ secrets.ACCESO_CLAVE }}
      HAY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Aviso si faltan los secretos
        if: env.HAY_TOKEN != 'true'
        run: echo "::warning::Falta CLOUDFLARE_API_TOKEN en los secretos del repo; no se publica."
      - name: Publicar en Cloudflare
        if: env.HAY_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            ACCESO_CLAVE
